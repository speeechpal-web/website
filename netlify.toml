[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/social-confidence.html"
  to = "/social-confidence"
  status = 301

[[redirects]]
  from = "/articulation-coach.html"
  to = "/articulation-coach"
  status = 301

[[redirects]]
  from = "/compare-social.html"
  to = "/compare-social"
  status = 301

[[redirects]]
  from = "/compare-articulation.html"
  to = "/compare-articulation"
  status = 301
